title: Bertrand Osei-Owusu Bosu
description: Notes on building, learning, and figuring things out.
url: "https://bertqrt.github.io"
baseurl: "/bertrandbosu-blog1"
permalink: /writing/:title/
markdown: kramdown
exclude:
  - CLAUDE.md
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Default share-preview image for links posted on WhatsApp, LinkedIn, X, etc.
# A post can override it with its own `image:` in the front matter.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png
