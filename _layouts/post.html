---
layout: default
---
{% assign words = content | strip_html | number_of_words %}
{% assign read_time = words | divided_by: 200 | at_least: 1 %}

<article class="post">
  <p class="meta">{{ read_time }} min &middot; {{ page.date | date: "%b %-d, %Y" }}</p>
  <h1>{{ page.title }}</h1>
  <div class="post-content">
    {{ content }}
  </div>
</article>
