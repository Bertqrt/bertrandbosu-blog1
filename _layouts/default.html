    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} &mdash; {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a href="{{ '/' | relative_url }}" class="home-link">Bertrand Bosu</a>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="footer">
      <p>&copy; {{ site.time | date: '%Y' }} Bertrand Bosu</p>
    </footer>
  </div>
</body>
</html>
