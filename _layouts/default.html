<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QSPCGVHDLS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QSPCGVHDLS');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (e) {}
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  {% if page.url == '/' %}
  <title>{{ site.title }}</title>
  {% seo title=false %}
  {% else %}
  {% seo %}
  {% endif %}
  {% feed_meta %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a href="{{ '/' | relative_url }}" class="home-link" aria-label="Bert Bosu, home">Bert Bosu</a>

      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light and dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/>
        </svg>
      </button>

      {% if page.layout == 'post' %}
      <div class="reading-progress" aria-hidden="true">
        <span class="reading-progress-bar"></span>
      </div>
      {% endif %}
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="footer">
      <p>&copy; {{ site.time | date: '%Y' }} Bertrand Osei-Owusu Bosu</p>
    </footer>
  </div>

  <button id="back-to-top" class="back-to-top" aria-label="Back to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>

  <script>
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var html = document.documentElement;
      var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });

    // Fold the header name down to its "B" on the way down the page,
    // and unfold it again on the way back up.
    (function () {
      var link = document.querySelector('.home-link');
      var text = link.textContent;
      var tail = [];
      link.textContent = '';
      for (var i = 0; i < text.length; i++) {
        var ch = document.createElement('span');
        ch.className = i === 0 ? 'fold-lead' : 'fold-char';
        ch.setAttribute('aria-hidden', 'true');
        ch.textContent = text[i];
        if (i > 0) {
          ch.style.setProperty('--i', i);
          tail.push(ch);
        }
        link.appendChild(ch);
      }
      link.style.setProperty('--n', text.length);

      // Each letter needs a real width so it can shrink to zero smoothly
      function measure() {
        var wasFolded = link.classList.contains('folded');
        link.classList.add('fold-instant');
        link.classList.remove('folded');
        tail.forEach(function (ch) { ch.style.removeProperty('--w'); });
        tail.forEach(function (ch) {
          ch.style.setProperty('--w', ch.getBoundingClientRect().width + 'px');
        });
        link.classList.toggle('folded', wasFolded);
        link.offsetWidth;
        link.classList.remove('fold-instant');
      }

      function setFolded(fold) {
        link.classList.toggle('folded', fold);
      }

      var FOLD_AT = 120;
      var UNFOLD_AFTER = 150;
      var lastY = getScrollPosition();
      var upTravel = 0;
      var ticking = false;

      function update() {
        ticking = false;
        var y = getScrollPosition();
        var dy = y - lastY;
        lastY = y;
        if (y < FOLD_AT) {
          upTravel = 0;
          setFolded(false);
        } else if (dy > 0) {
          upTravel = 0;
          setFolded(true);
        } else if (dy < 0) {
          upTravel -= dy;
          if (upTravel > UNFOLD_AFTER) setFolded(false);
        }
      }

      measure();
      if (lastY >= FOLD_AT) {
        link.classList.add('fold-instant', 'folded');
        link.offsetWidth;
        link.classList.remove('fold-instant');
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
      // Mobile browsers fire resize when the toolbar hides mid-scroll,
      // so only re-measure when the width really changes
      var lastWidth = window.innerWidth;
      window.addEventListener('resize', function () {
        if (window.innerWidth === lastWidth) return;
        lastWidth = window.innerWidth;
        measure();
      });
      window.addEventListener('scroll', function () {
        if (!ticking) {
          ticking = true;
          window.requestAnimationFrame(update);
        }
      }, { passive: true });
    })();

    var backToTop = document.getElementById('back-to-top');
    var isScrollingToTop = false;

    function getScrollPosition() {
      return window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    }

    function checkScrollVisibility() {
      if (isScrollingToTop) return;
      if (getScrollPosition() > 400) {
        backToTop.classList.add('visible');
      } else {
        backToTop.classList.remove('visible');
      }
    }

    window.addEventListener('scroll', checkScrollVisibility, { passive: true });

    backToTop.addEventListener('click', function () {
      isScrollingToTop = true;
      backToTop.classList.remove('visible');
      backToTop.blur();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      var interval = setInterval(function () {
        if (getScrollPosition() <= 10) {
          clearInterval(interval);
          isScrollingToTop = false;
          backToTop.classList.remove('visible');
        }
      }, 50);

      setTimeout(function () {
        clearInterval(interval);
        isScrollingToTop = false;
        checkScrollVisibility();
      }, 1000);
    });
  </script>

  <script src="https://instant.page/5.2.0" type="module" integrity="sha384-jnZyxPjiipYXnSU0ygqeac2q7CVYMbh84q0uHVRRxEtvFPiQYbXWUorga2aTKOasN"></script>
</body>
</html>
